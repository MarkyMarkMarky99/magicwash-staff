model = "gpt-5.6-luna"
model_reasoning_effort = "xhigh"

[agents]
enabled = true

[agents."clerk"]
description = "Writes unit/integration tests against Mason's actual implementation, then runs every gate — named, warden's, and its own — and reports command-backed results."
config_file = "agents/clerk.toml"

[agents."mason"]
description = "Implementation-focused agent for a finished, already-decided brief, working against tests it may never edit."
config_file = "agents/mason.toml"

[agents."sentinel"]
description = "Read-only static reviewer for correctness, safety, data-integrity, and explicit rule violations."
config_file = "agents/sentinel.toml"

[agents."warden"]
description = "Test-first specification agent that writes tests from the Public Contract and Acceptance Criteria before implementation exists, then mutation-proves every guard against the finished code."
config_file = "agents/warden.toml"
