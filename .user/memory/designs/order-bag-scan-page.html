<style>
  :root { --color-lime:#b2df26; --color-primary:#00564b; --color-on-primary:#fff; }
  body { font-family:"Noto Sans Thai",Inter,sans-serif; background:#d9dede; margin:0; }
  .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; font-size:24px; line-height:1; }
  .material-symbols-outlined.text-\[28px\]{font-size:28px}
  .sticker-button{display:grid;place-items:center;width:40px;height:40px;flex:0 0 40px;padding:0;border:2px solid var(--color-lime);border-radius:15px;background:transparent;color:var(--color-lime);transform:rotate(-7deg)}
  .sticker-glyph{width:25px;height:25px;overflow:visible;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .phone{width:390px;box-shadow:0 0 0 8px #1f2a28,0 18px 40px rgba(0,0,0,.25);border-radius:28px;overflow:hidden;background:#f8fafa}
  .badge{display:inline-flex;align-items:center;border-radius:9999px;font-weight:700;flex-shrink:0;line-height:1}

  .sticker-fab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:72px;height:72px;border:0;border-radius:23px 28px 24px 27px;background:#b2df26;color:#00564b;box-shadow:4px 4px 0 color-mix(in srgb, #00564b 70%, black);transform:rotate(-7deg);font-family:"Noto Sans Thai",Inter,sans-serif}
  .sticker-fab:disabled{background:#e6e8e8;color:#5f7772;box-shadow:3px 3px 0 #cae0dc}
  .sticker-label{transform:rotate(7deg);font-size:10px;font-weight:700;line-height:1}
  .phone{position:relative;min-height:800px}
</style>

const bags = [
  { n:1, kg:'12.6',  by:'Mark', at:'07 Oct 2026 · 03:15', tone:'#cfd9d6' },
  { n:2, kg:'8.2',   by:'Mark', at:'07 Oct 2026 · 03:18', tone:'#d6d9d2' },
  { n:3, kg:'3.3',  by:'Nok',  at:'07 Oct 2026 · 03:21', tone:'#d3dade' },
];
const total = bags.reduce((s,b)=>s+parseFloat(b.kg),0);
const totalLabel = (Math.round(total*100)/100).toString();

/* Placeholder "photo": a bag on a digital scale. Replaced by the real imagePath in the app. */
let photoSeq = 0;
function photo(b, cls) {
  const id = 'g' + (++photoSeq);
  return `<svg class="${cls}" viewBox="0 0 240 150" preserveAspectRatio="xMidYMid slice" aria-label="Placeholder weight photo">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${b.tone}"/><stop offset="1" stop-color="#aebab6"/></linearGradient></defs>
    <rect width="240" height="150" fill="url(#${id})"/>
    <rect y="112" width="240" height="38" fill="#9aa8a4" opacity=".55"/>
    <ellipse cx="120" cy="86" rx="62" ry="30" fill="#7e8f8a" opacity=".35"/>
    <path d="M78 84c-4-30 14-48 42-48s46 18 42 48c-3 16-84 16-84 0z" fill="#e9eeec" stroke="#8fa09b" stroke-width="2"/>
    <path d="M104 40c4-8 28-8 32 0" fill="none" stroke="#8fa09b" stroke-width="3" stroke-linecap="round"/>
    <rect x="52" y="96" width="136" height="30" rx="8" fill="#51615d"/>
    <rect x="52" y="96" width="136" height="9" rx="4" fill="#6a7b76"/>
    <rect x="92" y="108" width="56" height="14" rx="3" fill="#10211e"/>
    <text x="120" y="119" text-anchor="middle" font-family="Manrope,sans-serif" font-weight="800" font-size="12" fill="#b2df26">${b.kg}</text>
  </svg>`;
}

function header() {
  return `<header class="flex w-full min-w-0 flex-none items-center justify-between bg-primary px-4 pb-3 pt-3 text-on-primary shadow-md">
    <div class="flex items-center gap-2">
      <button class="sticker-button" aria-label="Open menu"><svg class="sticker-glyph" viewBox="0 0 28 28"><path d="M5 7h18M5 14h14M5 21h9"/></svg></button>
      <img src="${LOGO}" alt="" class="h-9 w-9 object-contain">
      <h1 class="font-headline text-lg font-bold tracking-tight">Magicwash Laundry</h1>
    </div>
    <button class="sticker-button" aria-label="Go back"><svg class="sticker-glyph" viewBox="0 0 28 28"><path d="M17.5 6 9.5 14l8 8"/></svg></button>
  </header>`;
}

function bagsFor(scanned) { return bags.map((b,i)=>({ ...b, scanned: i < scanned })); }
const ICON = (name, px, w) => `<span class="material-symbols-outlined" style="font-size:${px}px;font-variation-settings:'FILL' 0,'wght' ${w},'GRAD' 0,'opsz' 24" aria-hidden="true">${name}</span>`;

function summary(scanned, count) {
  const empty = count === 0;
  const done = !empty && scanned === count;
  const kg = empty ? '0' : totalLabel;
  const segs = empty ? '' : Array.from({length: count}, (_,i) =>
    `<div class="h-full flex-1 rounded-full ${i < scanned ? 'bg-lime' : 'bg-white/20'}"></div>`).join('');
  const progress = empty
    ? `<span class="font-[Manrope,sans-serif] text-[40px] font-extrabold leading-[44px] tracking-[-0.04em] tabular-nums">0</span>`
    : `<span class="font-[Manrope,sans-serif] text-[40px] font-extrabold leading-[44px] tracking-[-0.04em] tabular-nums ${done?'text-lime':''}">${scanned}</span><span class="font-[Manrope,sans-serif] text-[22px] font-bold tracking-[-0.03em] text-on-primary/60 tabular-nums"> / ${count}</span>`;
  const footer = empty
    ? `<p class="mt-2 font-body text-xs font-semibold text-on-primary/80">No bags weighed yet</p>`
    : done
      ? `<p class="mt-2 flex items-center gap-1.5 font-body text-xs font-extrabold text-lime"><span class="grid h-[18px] w-[18px] place-items-center rounded-full bg-lime text-primary">${ICON('check',13,700)}</span>All bags scanned · ready for delivery</p>`
      : `<p class="mt-2 font-body text-xs font-semibold text-on-primary/80"><span class="font-extrabold text-on-primary">${count-scanned}</span> ${count-scanned===1?'bag':'bags'} left to scan</p>`;
  return `<section class="relative mx-3 mt-4 overflow-hidden rounded-[20px] border ${done?'border-lime/60':'border-lime/25'} bg-primary text-on-primary shadow-lg">
    <div class="pointer-events-none absolute -right-[138px] -top-[112px] h-[270px] w-[270px] rounded-full border-[34px] border-lime/[0.17]"></div>
    <div class="pointer-events-none absolute -bottom-[21px] right-[38px] h-[42px] w-[42px] rounded-full bg-lime" style="box-shadow:-22px -11px 0 color-mix(in srgb, var(--color-lime) 22%, transparent)"></div>

    <div class="relative px-5 pb-3 pt-4">
      <div class="grid grid-cols-[minmax(0,1fr)_auto] items-start gap-x-4">
        <p class="min-w-0 truncate font-label text-[9px] font-bold uppercase tracking-[0.18em] text-lime">Customer · TSK</p>
        <p class="text-right font-label text-[9px] font-bold uppercase tracking-[0.18em] text-lime">Total weight</p>
        <h2 class="mt-0.5 min-w-0 truncate font-headline text-[26px] font-bold leading-8 tracking-tight">Tanaporn S.</h2>
        <p class="mt-0.5 text-right font-headline text-[30px] font-extrabold leading-8 tracking-tight text-lime">${kg}</p>
        <p class="mt-1 min-w-0 truncate font-body text-xs font-semibold text-on-primary/80">Order be2f58f2</p>
        <p class="mt-1 text-right font-body text-xs font-semibold text-on-primary/80">kg</p>
      </div>
    </div>

    <div class="relative mx-5 border-t border-white/15 pb-6 pt-3">
      <div class="flex items-end justify-between gap-3">
        <p class="font-label text-[9px] font-bold uppercase tracking-[0.14em] text-lime">Bags scanned</p>
        <span class="badge bg-info-container px-2.5 py-1 font-label text-[11px] text-on-info-container">Approved</span>
      </div>
      <p class="mt-1 flex items-baseline gap-0.5 font-headline">${progress}</p>
      <div class="mt-2 flex h-1.5 gap-[3px] rounded-full" role="progressbar" aria-label="Bags scanned" aria-valuemin="0" aria-valuemax="${count}" aria-valuenow="${scanned}">${segs}${empty?'<div class="h-full flex-1 rounded-full bg-white/20"></div>':''}</div>
      ${footer}
    </div>
  </section>`;
}

function sectionHeader(scanned, count) {
  return `<header class="mb-2.5 flex items-center justify-between gap-3">
    <div class="border-l-4 border-lime pl-2.5">
      <h2 class="font-headline text-[17px] font-extrabold tracking-[-0.03em] text-primary">Weight photos</h2>
      <p class="mt-[3px] font-label text-[9px] font-bold uppercase leading-none tracking-[0.1em] text-on-surface-variant">Scan every bag before delivery</p>
    </div>
    <p class="shrink-0 font-label text-[10px] font-extrabold uppercase tracking-[0.04em] text-on-surface-variant">${scanned} of ${count} scanned</p>
  </header>`;
}

const rowShadow = 'shadow-[0_1px_0_rgba(7,63,56,0.05)]';

/* Photo-right row (package-activity layout) with scan state */
function rows(list) {
  return `<ol class="grid gap-2">` + list.map(b => `
    <li class="grid grid-cols-[52px_minmax(0,1fr)_56px] items-center gap-2.5 rounded-[14px] px-3 py-2.5 ${rowShadow} bg-white">
      <p class="flex flex-col items-end justify-center self-stretch border-r ${b.scanned ? 'border-lime/60' : 'border-outline-variant'} pr-2 text-primary">
        <span class="font-[Manrope,sans-serif] text-[22px] font-extrabold leading-none tracking-[-0.06em] tabular-nums">${b.kg}</span>
        <span class="mt-[3px] font-label text-[11px] font-semibold leading-none text-on-surface-variant">kg</span>
      </p>
      <div class="min-w-0">
        <p class="truncate font-body text-sm font-extrabold leading-tight tracking-[-0.015em] text-on-surface">Bag ${b.n} · ${b.by}</p>
        <p class="mt-[3px] font-label text-[10px] font-semibold text-on-surface-variant">${b.at}</p>
        <p class="mt-1 font-label text-[10px] font-extrabold uppercase leading-none tracking-[0.04em] ${b.scanned ? 'text-success' : 'text-on-surface-variant'}">${b.scanned ? 'Scanned' : 'To scan'}</p>
      </div>
      <div class="relative h-14 w-14">
        <div class="h-full w-full overflow-hidden rounded-[10px] bg-surface-container ${b.scanned ? '' : 'opacity-60 saturate-50'}">${photo(b,'h-full w-full')}</div>
        ${b.scanned
          ? `<span class="absolute -right-1.5 -top-1.5 grid h-6 w-6 place-items-center rounded-full border-2 border-white bg-lime text-primary shadow-sm">${ICON('check',15,700)}</span>`
          : `<span class="absolute -right-1.5 -top-1.5 h-6 w-6 rounded-full border-2 border-dashed border-outline-variant bg-white"></span>`}
      </div>
    </li>`).join('') + `</ol>`;
}

function emptyCard() {
  return `<div class="flex flex-col items-center rounded-[14px] bg-white px-4 py-7 text-center ${rowShadow}">
    <span class="grid h-14 w-14 place-items-center rounded-[18px] bg-secondary-container text-on-secondary-container" style="transform:rotate(-7deg)"><span class="material-symbols-outlined text-[28px]">scale</span></span>
    <p class="mt-3 font-body text-sm font-extrabold tracking-[-0.015em] text-on-surface">No weight photos yet</p>
    <p class="mt-1 font-body text-[13px] text-on-surface-variant">Bags weighed at the counter appear here to be scanned.</p>
  </div>`;
}

function phone(label, note, scanned, count, body, disabledFab) {
  return `<div class="flex flex-col items-center gap-5">
    <div class="text-center"><p class="font-[Manrope,sans-serif] text-[15px] font-extrabold text-primary">${label}</p><p class="text-xs text-on-surface-variant">${note}</p></div>
    <div class="phone flex flex-col">
      ${header()}
      <main class="flex-1 bg-surface pb-32">
        ${summary(scanned, count)}
        <section class="mx-3 mt-5">${sectionHeader(scanned, count)}${body}</section>
      </main>
      <button type="button" class="sticker-fab absolute bottom-[max(1.25rem,env(safe-area-inset-bottom))] right-5 z-10" aria-label="Scan tag" ${disabledFab?'disabled':''}>
        <span class="material-symbols-outlined" style="font-size:36px;font-variation-settings:'wght' 600" aria-hidden="true">qr_code_scanner</span>
        <span class="sticker-label">Scan</span>
      </button>
    </div>
  </div>`;
}

document.getElementById('stage').innerHTML =
  phone('Scanning · 2 of 3', 'Bag 3 still to scan', 2, 3, rows(bagsFor(2)), false) +
  phone('Complete · 3 of 3', 'Every bag scanned', 3, 3, rows(bagsFor(3)), false) +
  phone('Empty state', 'No WEIGHT images for this order yet', 0, 0, emptyCard(), true);
</script>
</body>
</html>
